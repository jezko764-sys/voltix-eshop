<!DOCTYPE html>
<html lang="sk">
<head><link rel="manifest" href="./manifest.json">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#070b12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VOLTIX RUSH" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%23091120'/%3E%3Ccircle cx='64' cy='64' r='36' fill='%2338bdf8'/%3E%3Cpath d='M70 28L38 69h23l-3 31 32-41H67z' fill='%23061018'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%23091120'/%3E%3Ccircle cx='64' cy='64' r='36' fill='%2338bdf8'/%3E%3Cpath d='M70 28L38 69h23l-3 31 32-41H67z' fill='%23061018'/%3E%3C/svg%3E" />
  <title>VOLTIX RUSH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at top, #12203a 0%, #070b12 68%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 10px; overflow: hidden; touch-action: none;
    }
    .hud {
      width: 100%; max-width: 440px;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
      background: rgba(17, 24, 39, 0.92); border: 1px solid #24324d; border-radius: 12px;
      padding: 9px 10px; margin-bottom: 8px; font-size: 0.8rem;
    }
    .hud-item { display: flex; flex-direction: column; gap: 2px; }
    .hud-item span { color: #94a3b8; font-size: 0.65rem; text-transform: uppercase; }
    .hud-item strong { font-size: 0.92rem; color: #38bdf8; }
    .good { color: #22c55e !important; }
    .coin { color: #facc15 !important; }
    .shield { color: #d8b4fe !important; }
    .wrap {
      position: relative; width: 100%; max-width: 440px;
      aspect-ratio: 9 / 14; max-height: 73dvh;
      border-radius: 16px; overflow: hidden;
      border: 1px solid #24324d; background: #0b1220;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
    }
    canvas { width: 100%; height: 100%; display: block; }
    .top-btns { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 3; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(17, 24, 39, 0.92); color: #f8fafc;
      border: 1px solid #24324d; font-size: 0.88rem; cursor: pointer;
    }
    .overlay {
      position: absolute; inset: 0; background: rgba(7, 11, 18, 0.93);
      backdrop-filter: blur(4px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 18px; gap: 11px; z-index: 4; overflow-y: auto;
    }
    .hidden { display: none !important; }
    .app-badge {
      width: 64px; height: 64px; border-radius: 16px;
      background: #0f1b2e; border: 1px solid #2e4368;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 24px rgba(56, 189, 248, 0.2);
    }
    h1 { font-size: 1.8rem; letter-spacing: 0.04em; }
    h2 { font-size: 1.2rem; }
    p { color: #94a3b8; font-size: 0.85rem; max-width: 310px; line-height: 1.4; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .btn {
      background: #38bdf8; color: #051018; border: none; border-radius: 10px;
      padding: 11px 18px; font-size: 0.92rem; font-weight: 700; cursor: pointer;
    }
    .btn-sec {
      background: #172236; color: #f8fafc; border: 1px solid #24324d; border-radius: 10px;
      padding: 11px 16px; font-size: 0.88rem; font-weight: 600; cursor: pointer;
    }
    .shop-list { width: 100%; max-width: 335px; display: grid; gap: 8px; text-align: left; }
    .card {
      background: #111827; border: 1px solid #24324d; border-radius: 11px;
      padding: 9px 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .card strong { display: block; font-size: 0.86rem; }
    .card small { color: #94a3b8; font-size: 0.72rem; }
    .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; }
    .sbtn {
      border: none; border-radius: 8px; padding: 7px 10px; font-size: 0.75rem;
      font-weight: 700; cursor: pointer; background: #facc15; color: #161100;
    }
    .sbtn.ok { background: #22c55e; color: #041309; }
    .sbtn.use { background: #38bdf8; color: #051018; }
    .sbtn:disabled { opacity: 0.45; cursor: not-allowed; }
    .box {
      background: #111827; border: 1px solid #24324d; border-radius: 12px;
      padding: 11px 16px; width: 100%; max-width: 280px; display: grid; gap: 6px;
    }
    .box div { display: flex; justify-content: space-between; font-size: 0.88rem; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-item"><span>Body</span><strong id="score-el" class="good">0</strong></div>
    <div class="hud-item"><span>Mince</span><strong id="coins-el" class="coin">0</strong></div>
    <div class="hud-item"><span>Rekord</span><strong id="best-el">0</strong></div>
    <div class="hud-item"><span>Úroveň</span><strong id="level-el">1</strong></div>
    <div class="hud-item"><span>Štíty</span><strong id="shield-el" class="shield">0</strong></div>
  </div>

  <div class="wrap">
    <div class="top-btns">
      <button type="button" class="icon-btn" id="shop-top-btn" title="Obchod">🛒</button>
      <button type="button" class="icon-btn" id="sound-btn" title="Zvuk">🔊</button>
      <button type="button" class="icon-btn" id="pause-btn" title="Pauza">⏸</button>
    </div>

    <canvas id="game" width="360" height="560"></canvas>

    <div class="overlay" id="start-overlay">
      <div class="app-badge" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 128 128">
          <circle cx="64" cy="64" r="44" fill="#38bdf8" />
          <path d="M70 24L36 69h24l-3 35 35-45H67z" fill="#061018" />
        </svg>
      </div>
      <h1>VOLTIX RUSH</h1>
      <p>Ťukni vľavo/vpravo alebo potiahni prstom. Zbieraj batérie, mince a štíty, a vyhni sa skratom.</p>
      <div class="row">
        <button type="button" class="btn" id="start-btn">Spustiť hru</button>
        <button type="button" class="btn-sec" id="open-shop-btn">🛒 Úpravy a obchod</button>
      </div>
    </div>

    <div class="overlay hidden" id="shop-overlay">
      <h2>Obchod a úpravy</h2>
      <p>Zostatok: <strong id="shop-coins-el" class="coin">0</strong> mincí</p>
      <div class="shop-list" id="shop-skins"></div>
      <div class="shop-list" id="shop-upgrades"></div>
      <button type="button" class="btn" id="close-shop-btn">Späť</button>
    </div>

    <div class="overlay hidden" id="pause-overlay">
      <h1>Pauza</h1>
      <p>Hra je pozastavená.</p>
      <div class="row">
        <button type="button" class="btn" id="resume-btn">Pokračovať</button>
        <button type="button" class="btn-sec" id="pause-shop-btn">🛒 Úpravy</button>
      </div>
    </div>

    <div class="overlay hidden" id="gameover-overlay">
      <h1>Koniec hry</h1>
      <div class="box">
        <div><span>Skóre:</span><strong id="final-score">0</strong></div>
        <div><span>Získané mince:</span><strong id="final-coins" class="coin">0</strong></div>
        <div><span>Úroveň:</span><strong id="final-level">1</strong></div>
        <div><span>Rekord:</span><strong id="final-best">0</strong></div>
      </div>
      <div class="row">
        <button type="button" class="btn" id="restart-btn">Hrať znova</button>
        <button type="button" class="btn-sec" id="gameover-shop-btn">🛒 Úpravy</button>
      </div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score-el");
    const coinsEl = document.getElementById("coins-el");
    const bestEl = document.getElementById("best-el");
    const levelEl = document.getElementById("level-el");
    const shieldEl = document.getElementById("shield-el");
    const shopCoinsEl = document.getElementById("shop-coins-el");

    const finalScoreEl = document.getElementById("final-score");
    const finalCoinsEl = document.getElementById("final-coins");
    const finalLevelEl = document.getElementById("final-level");
    const finalBestEl = document.getElementById("final-best");

    const startOverlay = document.getElementById("start-overlay");
    const shopOverlay = document.getElementById("shop-overlay");
    const pauseOverlay = document.getElementById("pause-overlay");
    const gameoverOverlay = document.getElementById("gameover-overlay");

    const startBtn = document.getElementById("start-btn");
    const openShopBtn = document.getElementById("open-shop-btn");
    const shopTopBtn = document.getElementById("shop-top-btn");
    const pauseShopBtn = document.getElementById("pause-shop-btn");
    const gameoverShopBtn = document.getElementById("gameover-shop-btn");
    const closeShopBtn = document.getElementById("close-shop-btn");
    const resumeBtn = document.getElementById("resume-btn");
    const restartBtn = document.getElementById("restart-btn");
    const pauseBtn = document.getElementById("pause-btn");
    const soundBtn = document.getElementById("sound-btn");

    const BEST_KEY = "voltix_rush_best_v5";
    const COINS_KEY = "voltix_rush_coins_v5";
    const SAVE_KEY = "voltix_rush_save_v5";
    const MAX_SHIELDS = 5;

    const SKINS = [
      { id: "volt", name: "Volt Modrá", desc: "Klasické elektrické jadro", price: 0, fill: "#38bdf8", stroke: "#e0f2fe", sym: "⚡", special: "none" },
      { id: "rainbow", name: "Dúhový Reaktor", desc: "Plynule mení farby celým spektrom", price: 20, fill: "linear-gradient(135deg,#ef4444,#facc15,#22c55e,#38bdf8,#a855f7)", stroke: "#ffffff", sym: "🌈", special: "rainbow" },
      { id: "galaxy", name: "Galaxia", desc: "Vesmírny stred s hviezdami a prstencom", price: 35, fill: "radial-gradient(circle at 35% 35%,#6d28d9,#1e1b4b 65%,#090d16)", stroke: "#c4b5fd", sym: "✦", special: "galaxy" },
      { id: "plasma", name: "Plazma Blesk", desc: "Pulzujúci elektrický prstenec", price: 50, fill: "#06b6d4", stroke: "#a5f3fc", sym: "⚡", special: "plasma" },
      { id: "diamond", name: "Kryštál", desc: "Lesklý ľadovo-diamantový odlesk", price: 70, fill: "linear-gradient(135deg,#e0f2fe,#7dd3fc,#bae6fd)", stroke: "#ffffff", sym: "◆", special: "diamond" }
    ];

    const UPGRADES = [
      { id: "startShield", name: "Štartovací štít", desc: "+1 štít na začiatku každej hry", price: 25 },
      { id: "longInvuln", name: "Pevnejšia ochrana", desc: "Dlhšia nezraniteľnosť po zásahu", price: 35 }
    ];

    let bestScore = Number(localStorage.getItem(BEST_KEY) || 0);
    let totalCoins = Number(localStorage.getItem(COINS_KEY) || 0);
    let saveData = {
      skin: "volt",
      owned: ["volt"],
      upgrades: { startShield: 0, longInvuln: 0 }
    };

    try {
      const p = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      if (p) {
        saveData = {
          skin: p.skin || "volt",
          owned: Array.isArray(p.owned) && p.owned.length ? p.owned : ["volt"],
          upgrades: {
            startShield: Number(p.upgrades?.startShield || 0),
            longInvuln: Number(p.upgrades?.longInvuln || 0)
          }
        };
      }
    } catch (_) {}

    function saveAll() {
      localStorage.setItem(BEST_KEY, String(bestScore));
      localStorage.setItem(COINS_KEY, String(totalCoins));
      localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    }

    function updateHud() {
      bestEl.textContent = String(bestScore);
      coinsEl.textContent = String(totalCoins);
      shopCoinsEl.textContent = String(totalCoins);
    }
    updateHud();

    let soundOn = true;
    let audioCtx = null;
    function beep(freq, dur, type = "sine", vol = 0.07) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch (_) {}
    }

    const lanes = [72, 180, 288];
    const player = { lane: 1, x: lanes[1], y: canvas.height - 76, radius: 20, shields: 0, invuln: 0 };
    let items = [], particles = [], texts = [], trail = [];
    let score = 0, runCoins = 0, combo = 0, level = 1, speed = 225, spawnTimer = 0.25, trackOff = 0, shake = 0;
    let running = false, paused = false, lastTime = 0, startX = null, backOverlay = startOverlay;

    function updateShieldText() {
      if (player.shields > 0) {
        shieldEl.textContent = "🛡".repeat(Math.min(player.shields, 3)) + (player.shields > 3 ? ` +${player.shields - 3}` : "");
      } else {
        shieldEl.textContent = "0";
      }
    }

    function renderShop() {
      shopCoinsEl.textContent = String(totalCoins);
      const skinsBox = document.getElementById("shop-skins");
      const upgBox = document.getElementById("shop-upgrades");
      skinsBox.innerHTML = "";
      upgBox.innerHTML = "";

      for (const s of SKINS) {
        const has = saveData.owned.includes(s.id);
        const active = saveData.skin === s.id;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<div class="dot" style="background:${s.fill}"></div><div style="flex:1"><strong>${s.name}</strong><small>${s.desc}</small></div>`;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sbtn";
        if (active) {
          btn.textContent = "Aktívne"; btn.classList.add("ok"); btn.disabled = true;
        } else if (has) {
          btn.textContent = "Zvoliť"; btn.classList.add("use");
          btn.onclick = () => { saveData.skin = s.id; saveAll(); beep(620, 0.08); renderShop(); drawFrameOnly(); };
        } else {
          btn.textContent = `${s.price} 🪙`; btn.disabled = totalCoins < s.price;
          btn.onclick = () => {
            if (totalCoins < s.price) return;
            totalCoins -= s.price; saveData.owned.push(s.id); saveData.skin = s.id;
            saveAll(); updateHud(); beep(820, 0.12); renderShop(); drawFrameOnly();
          };
        }
        card.appendChild(btn);
        skinsBox.appendChild(card);
      }

      for (const u of UPGRADES) {
        const done = Number(saveData.upgrades[u.id] || 0) >= 1;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<div style="flex:1"><strong>${u.name}</strong><small>${u.desc}</small></div>`;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sbtn";
        if (done) {
          btn.textContent = "Hotovo"; btn.classList.add("ok"); btn.disabled = true;
        } else {
          btn.textContent = `${u.price} 🪙`; btn.disabled = totalCoins < u.price;
          btn.onclick = () => {
            if (totalCoins < u.price) return;
            totalCoins -= u.price; saveData.upgrades[u.id] = 1;
            saveAll(); updateHud(); beep(860, 0.14); renderShop();
          };
        }
        card.appendChild(btn);
        upgBox.appendChild(card);
      }
    }

    function openShop(from) {
      backOverlay = from;
      if (running && !paused) { paused = true; running = false; }
      startOverlay.classList.add("hidden");
      pauseOverlay.classList.add("hidden");
      gameoverOverlay.classList.add("hidden");
      renderShop();
      shopOverlay.classList.remove("hidden");
    }

    function closeShop() {
      shopOverlay.classList.add("hidden");
      backOverlay.classList.remove("hidden");
    }
    function addSparks(x, y, color, n = 10) {
      for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i) / n + Math.random() * 0.4;
        const v = 50 + Math.random() * 130;
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.45 + Math.random() * 0.2, color });
      }
    }

    function addPopText(x, y, text, color) {
      texts.push({ x, y, text, color, life: 0.75 });
    }

    function resetGame() {
      score = 0; runCoins = 0; combo = 0; level = 1; speed = 225; spawnTimer = 0.2; shake = 0;
      items = []; particles = []; texts = []; trail = [];
      player.lane = 1; player.x = lanes[1];
      player.shields = Math.min(MAX_SHIELDS, Number(saveData.upgrades.startShield || 0));
      player.invuln = 0; paused = false;

      scoreEl.textContent = "0"; levelEl.textContent = "1";
      updateHud(); updateShieldText();

      startOverlay.classList.add("hidden"); shopOverlay.classList.add("hidden");
      pauseOverlay.classList.add("hidden"); gameoverOverlay.classList.add("hidden");

      running = true; lastTime = performance.now();
      beep(520, 0.12, "triangle");
      requestAnimationFrame(loop);
    }

    function togglePause() {
      if (!shopOverlay.classList.contains("hidden")) return;
      if (!running && !paused) return;
      if (paused) {
        paused = false; running = true;
        pauseOverlay.classList.add("hidden");
        lastTime = performance.now();
        requestAnimationFrame(loop);
      } else {
        paused = true; running = false;
        pauseOverlay.classList.remove("hidden");
      }
    }

    function endGame() {
      running = false; paused = false; shake = 10;
      beep(150, 0.35, "sawtooth", 0.09);
      addSparks(player.x, player.y, "#ef4444", 18);
      if (score > bestScore) bestScore = score;
      saveAll(); updateHud();

      finalScoreEl.textContent = String(score);
      finalCoinsEl.textContent = String(runCoins);
      finalLevelEl.textContent = String(level);
      finalBestEl.textContent = String(bestScore);
      gameoverOverlay.classList.remove("hidden");
    }

    function moveLane(d) {
      if (!running || paused) return;
      const next = Math.max(0, Math.min(2, player.lane + d));
      if (next !== player.lane) { player.lane = next; beep(360, 0.05, "sine", 0.04); }
    }

    function spawnItem() {
      const lane = Math.floor(Math.random() * 3);
      const r = Math.random();
      let type = "hazard", size = 20;
      if (player.shields < MAX_SHIELDS && r < 0.13) { type = "shield"; size = 17; }
      else if (r < 0.35) { type = "coin"; size = 15; }
      else if (r < 0.72) { type = "battery"; size = 16; }
      items.push({ lane, x: lanes[lane], y: -30, size, type });
    }

    function drawBg() {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (shake > 0.1) {
        const sx = (Math.random() - 0.5) * shake;
        const sy = (Math.random() - 0.5) * shake;
        ctx.translate(sx, sy);
      }

      ctx.strokeStyle = "rgba(56, 189, 248, 0.12)";
      ctx.lineWidth = 1;
      for (const lx of lanes) { ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, canvas.height); ctx.stroke(); }

      const gap = 48;
      const sy = (trackOff % gap) - gap;
      ctx.strokeStyle = "rgba(148, 163, 184, 0.14)";
      ctx.setLineDash([12, 36]);
      for (const lx of [126, 234]) { ctx.beginPath(); ctx.moveTo(lx, sy); ctx.lineTo(lx, canvas.height); ctx.stroke(); }
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawTrail(skinColor) {
      for (let i = 0; i < trail.length; i++) {
        const t = trail[i];
        const ratio = (i + 1) / trail.length;
        ctx.save();
        ctx.globalAlpha = ratio * 0.25;
        ctx.fillStyle = skinColor;
        ctx.beginPath();
        ctx.arc(t.x, t.y, player.radius * ratio * 0.85, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawBall() {
      const prevX = player.x;
      player.x += (lanes[player.lane] - player.x) * 0.28;
      if (Math.abs(player.x - prevX) > 0.4 || running) {
        trail.push({ x: player.x, y: player.y + 6 });
        if (trail.length > 7) trail.shift();
      }

      if (player.invuln > 0 && Math.floor(player.invuln * 16) % 2 === 0) return;

      const skin = SKINS.find((s) => s.id === saveData.skin) || SKINS[0];
      const nowSec = performance.now() / 1000;
      const hue = (nowSec * 150) % 360;

      let mainFill = skin.fill;
      let mainStroke = skin.stroke;
      let symColor = "#061018";

      if (skin.special === "rainbow") {
        mainFill = `hsl(${hue}, 92%, 56%)`;
        mainStroke = `hsl(${(hue + 60) % 360}, 100%, 82%)`;
      } else if (skin.special === "galaxy") {
        mainFill = "#1e1b4b";
        mainStroke = "#c4b5fd";
        symColor = "#f5d0fe";
      } else if (skin.special === "plasma") {
        mainFill = "#06b6d4";
        mainStroke = "#cffafe";
      } else if (skin.special === "diamond") {
        mainFill = "#bae6fd";
        mainStroke = "#ffffff";
        symColor = "#0c4a6e";
      }

      ctx.save();
      if (shake > 0.1) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }

      drawTrail(mainFill);

      if (skin.special === "plasma") {
        const pulse = 5 + Math.sin(nowSec * 12) * 3;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius + pulse, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(34, 211, 238, 0.55)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      if (skin.special === "galaxy") {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(nowSec * 2.2);
        ctx.beginPath();
        ctx.ellipse(0, 0, player.radius + 8, 6, 0.35, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(196, 181, 253, 0.65)";
        ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.restore();
      }

      if (player.shields > 0) {
        for (let s = 0; s < Math.min(player.shields, 3); s++) {
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.radius + 6 + s * 4, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(168, 85, 247, ${0.9 - s * 0.22})`;
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }
      }

      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = mainFill; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = mainStroke; ctx.stroke();

      if (skin.special === "galaxy") {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(player.x - 8, player.y - 7, 1.8, 0, Math.PI * 2);
        ctx.arc(player.x + 9, player.y - 5, 1.4, 0, Math.PI * 2);
        ctx.arc(player.x + 6, player.y + 8, 1.6, 0, Math.PI * 2);
        ctx.fill();
      } else if (skin.special === "diamond") {
        ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.radius + 3);
        ctx.lineTo(player.x + player.radius - 4, player.y);
        ctx.lineTo(player.x, player.y + player.radius - 3);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = symColor; ctx.font = "bold 14px system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(skin.sym, player.x, player.y + 1);
      ctx.restore();
    }

    function drawFrameOnly() {
      drawBg();
      drawBall();
    }

    function drawItems() {
      ctx.save();
      if (shake > 0.1) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }
      for (const it of items) {
        ctx.save();
        if (it.type === "battery") {
          ctx.fillStyle = "#22c55e";
          ctx.beginPath(); ctx.roundRect(it.x - 13, it.y - 16, 26, 32, 6); ctx.fill();
          ctx.fillStyle = "#bbf7d0"; ctx.fillRect(it.x - 6, it.y - 21, 12, 5);
        } else if (it.type === "coin") {
          ctx.fillStyle = "#facc15";
          ctx.beginPath(); ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = "#422006"; ctx.font = "bold 12px system-ui, sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("¢", it.x, it.y + 1);
        } else if (it.type === "shield") {
          ctx.fillStyle = "#a855f7";
          ctx.beginPath(); ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#f3e8ff"; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = "#ffffff"; ctx.font = "bold 13px system-ui, sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("🛡", it.x, it.y + 1);
        } else {
          ctx.fillStyle = "#ef4444";
          ctx.beginPath(); ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#fecaca"; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.restore();
      }
      ctx.restore();
    }

    function drawEffects(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
      for (let i = texts.length - 1; i >= 0; i--) {
        const t = texts[i];
        t.y -= 36 * dt; t.life -= dt;
        if (t.life <= 0) { texts.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = Math.min(1, t.life * 1.5); ctx.fillStyle = t.color;
        ctx.font = "bold 13px system-ui, sans-serif"; ctx.textAlign = "center";
        ctx.fillText(t.text, t.x, t.y); ctx.restore();
      }
    }

    function update(dt) {
      trackOff += speed * dt;
      if (shake > 0) shake = Math.max(0, shake - dt * 32);
      if (player.invuln > 0) player.invuln = Math.max(0, player.invuln - dt);

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnItem();
        spawnTimer = Math.max(0.35, 0.84 - (level - 1) * 0.045);
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += speed * dt;

        if (Math.abs(it.x - player.x) < player.radius + it.size - 4 && Math.abs(it.y - player.y) < player.radius + it.size - 4) {
          items.splice(i, 1);

          if (it.type === "battery") {
            combo += 1;
            const pts = combo >= 5 ? 15 : 10;
            score += pts; scoreEl.textContent = String(score);
            if (score > bestScore) { bestScore = score; saveAll(); updateHud(); }

            const nextLvl = Math.floor(score / 60) + 1;
            if (nextLvl > level) {
              level = nextLvl; levelEl.textContent = String(level);
              speed = 225 + (level - 1) * 30;
              totalCoins += 2; runCoins += 2; saveAll(); updateHud();
              addPopText(player.x, player.y - 34, `ÚROVEŇ ${level}! +2 🪙`, "#38bdf8");
            }
            beep(620 + Math.min(combo * 25, 250), 0.09, "triangle", 0.06);
            addSparks(player.x, player.y - 12, "#22c55e", 8);
            addPopText(it.x, it.y - 10, `+${pts}`, "#22c55e");
          } else if (it.type === "coin") {
            totalCoins += 1; runCoins += 1; saveAll(); updateHud();
            beep(880, 0.11); addSparks(it.x, it.y, "#facc15", 9); addPopText(it.x, it.y - 10, "+1 🪙", "#facc15");
          } else if (it.type === "shield") {
            player.shields = Math.min(MAX_SHIELDS, player.shields + 1);
            updateShieldText(); beep(760 + player.shields * 60, 0.14);
            addSparks(player.x, player.y, "#a855f7", 12);
            addPopText(it.x, it.y - 10, `+1 ŠTÍT (${player.shields})`, "#d8b4fe");
          } else {
            if (player.invuln > 0) continue;
            if (player.shields > 0) {
              player.shields -= 1;
              player.invuln = saveData.upgrades.longInvuln ? 1.45 : 0.8;
              shake = 6;
              combo = 0; updateShieldText(); beep(240, 0.16, "square", 0.05);
              addSparks(player.x, player.y, "#a855f7", 14);
              addPopText(it.x, it.y - 10, `ŠTÍT ZNIČENÝ (${player.shields})`, "#e9d5ff");
            } else {
              endGame(); return;
            }
          }
          continue;
        }

        if (it.y > canvas.height + 40) {
          if (it.type === "battery") combo = 0;
          items.splice(i, 1);
        }
      }
    }

    function loop(now) {
      if (!running) return;
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      drawBg(); update(dt); drawItems(); drawBall(); drawEffects(dt);
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("pointerdown", (e) => { startX = e.clientX; });
    canvas.addEventListener("pointerup", (e) => {
      if (startX === null || !running || paused) return;
      const diff = e.clientX - startX;
      if (Math.abs(diff) > 24) moveLane(diff > 0 ? 1 : -1);
      else {
        const rect = canvas.getBoundingClientRect();
        moveLane(e.clientX - rect.left < rect.width / 2 ? -1 : 1);
      }
      startX = null;
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") moveLane(-1);
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") moveLane(1);
      if (e.key === "p" || e.key === "P" || e.key === "Escape") togglePause();
    });

    startBtn.onclick = resetGame;
    openShopBtn.onclick = () => openShop(startOverlay);
    shopTopBtn.onclick = () => openShop(paused ? pauseOverlay : startOverlay);
    pauseShopBtn.onclick = () => openShop(pauseOverlay);
    gameoverShopBtn.onclick = () => openShop(gameoverOverlay);
    closeShopBtn.onclick = closeShop;
    resumeBtn.onclick = togglePause;
    restartBtn.onclick = resetGame;
    pauseBtn.onclick = togglePause;
    soundBtn.onclick = () => { soundOn = !soundOn; soundBtn.textContent = soundOn ? "🔊" : "🔇"; };

    drawFrameOnly();
  </script>
